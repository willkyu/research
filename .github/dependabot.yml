version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # Separated so a risky third-party major cannot block ecosystem updates.
      quartz-ecosystem:
        applies-to: "version-updates"
        patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
        update-types:
          - "minor"
          - "patch"
      # Isolated because a compiler major needs a tsconfig migration of its own.
      typescript:
        applies-to: "version-updates"
        patterns:
          - "typescript"
      production-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"
        exclude-patterns:
          - "@quartz-community/*"
          - "@quartz-themes/*"
          - "typescript"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "preact"
        update-types:
          - "version-update:semver-major"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      ci-dependencies:
        applies-to: "version-updates"
        patterns:
          - "*"

name: Dependabot Auto-merge

on:
  workflow_run:
    workflows: ["Build and Test"]
    types: [completed]

permissions:
  checks: read
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: >-
      github.repository == 'willkyu/research' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]' &&
      contains(github.event.workflow_run.head_branch, 'quartz-ecosystem')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Resolve Dependabot pull request
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          number=$(gh pr list --state open --app dependabot \
            --json number,headRefOid \
            --jq "map(select(.headRefOid == \"${HEAD_SHA}\")) | first | .number // empty")

          if [ -z "$number" ]; then
            echo "No open Dependabot PR matches ${HEAD_SHA}; nothing to merge."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "number=${number}" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Require every check to have finished successfully
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          runs=$(gh api "repos/${GH_REPO}/commits/${HEAD_SHA}/check-runs" --paginate \
            --jq '.check_runs[] | "\(.name)\t\(.status)\t\(.conclusion // \"\")"')

          if [ -z "$runs" ]; then
            echo "No check runs found for ${HEAD_SHA}; refusing to merge."
            exit 1
          fi

          echo "$runs"
          bad=$(printf '%s\n' "$runs" | awk -F'\t' '
            $2 != "completed" { print; next }
            $3 != "success" && $3 != "neutral" && $3 != "skipped" { print }
          ')
          if [ -n "$bad" ]; then
            echo "Refusing to merge because some checks are incomplete or unsuccessful:"
            printf '%s\n' "$bad"
            exit 1
          fi

      - name: Squash and merge
        if: steps.pr.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$PR_NUMBER" --squash --delete-branch
